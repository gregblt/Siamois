<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directed Graph from JSON</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        .node circle {
            fill: #69b3a2;
            stroke: #333;
            stroke-width: 1.5px;
        }

        .link {
            stroke: #999;
            stroke-opacity: 0.6;
            marker-end: url(#arrow);
        }

        text {
            font-size: 12px;
            fill: #333;
        }
    </style>
</head>
<body>
<script>
    data ={"nodes":[{"id":0,"label":"Node 0"},{"id":2,"label":"Node 2"},{"id":3,"label":"Node 3"},{"id":4,"label":"Node 4"},{"id":5,"label":"Node 5"},{"id":6,"label":"Node 6"},{"id":7,"label":"Node 7"},{"id":8,"label":"Node 8"},{"id":9,"label":"Node 9"},{"id":10,"label":"Node 10"},{"id":11,"label":"Node 11"},{"id":12,"label":"Node 12"},{"id":13,"label":"Node 13"},{"id":14,"label":"Node 14"},{"id":15,"label":"Node 15"},{"id":16,"label":"Node 16"},{"id":17,"label":"Node 17"},{"id":18,"label":"Node 18"},{"id":19,"label":"Node 19"},{"id":20,"label":"Node 20"},{"id":21,"label":"Node 21"}],"edges":[{"source":0,"target":2},{"source":2,"target":3},{"source":2,"target":4},{"source":2,"target":5},{"source":3,"target":6},{"source":3,"target":7},{"source":3,"target":8},{"source":3,"target":9},{"source":3,"target":10},{"source":3,"target":11},{"source":4,"target":12},{"source":4,"target":13},{"source":4,"target":14},{"source":4,"target":15},{"source":4,"target":16},{"source":4,"target":17},{"source":5,"target":18},{"source":5,"target":19},{"source":5,"target":20},{"source":5,"target":21},{"source":21,"target":0}]}

            const width = 800;
            const height = 600;

            // Create an SVG canvas
            const svg = d3.select("body")
                .append("svg")
                .attr("width", width)
                .attr("height", height);

            // Define arrow markers for directed edges
            svg.append("defs").append("marker")
                .attr("id", "arrow")
                .attr("viewBox", "0 -5 10 10")
                .attr("refX", 15)
                .attr("refY", 0)
                .attr("markerWidth", 6)
                .attr("markerHeight", 6)
                .attr("orient", "auto")
                .append("path")
                .attr("d", "M0,-5L10,0L0,5")
                .attr("fill", "#999");

            // Define the simulation
            const simulation = d3.forceSimulation(data.nodes)
                .force("link", d3.forceLink(data.edges).id(d => d.id).distance(150))
                .force("charge", d3.forceManyBody().strength(-500))
                .force("center", d3.forceCenter(width / 2, height / 2));

            // Draw links
            const link = svg.append("g")
                .attr("class", "links")
                .selectAll("line")
                .data(data.edges)
                .enter().append("line")
                .attr("class", "link");

            // Draw nodes
            const node = svg.append("g")
                .attr("class", "nodes")
                .selectAll("g")
                .data(data.nodes)
                .enter().append("g");

            node.append("circle")
                .attr("r", 10)
                .attr("fill", "#69b3a2")
                .call(d3.drag()
                    .on("start", dragStarted)
                    .on("drag", dragged)
                    .on("end", dragEnded));

            node.append("text")
                .attr("x", 15)
                .attr("y", 5)
                .text(d => d.label);

            // Update positions on each tick
            simulation.on("tick", () => {
                link
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                node
                    .attr("transform", d => `translate(${d.x},${d.y})`);
            });

            // Dragging functions
            function dragStarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }

            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }

            function dragEnded(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }

</script>
</body>
</html>
